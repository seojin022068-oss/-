<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인과 재료 × 프롬프트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eeece8; --ink:#2a2a2a; --mute:#9a968f; --paper:#fbfaf7;
    --pw:300px; --ph:424px; /* set by JS */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans KR",system-ui,sans-serif;overflow:hidden;
    -webkit-font-smoothing:antialiased;user-select:none}

  header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;
    padding:22px 28px;font-size:12px;letter-spacing:.04em;color:var(--mute);z-index:10}
  header b{font-weight:500;color:var(--ink)}

  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    perspective:2800px}
  .book{position:relative;width:calc(var(--pw)*2);height:var(--ph);
    transform-style:preserve-3d;
    transition:transform 1.1s cubic-bezier(.65,.05,.36,1), opacity 1s ease;
    opacity:0}
  .book.ready{opacity:1}
  /* closed (front): only right half visible -> shift left so cover is centered */
  .book.closed-front{transform:translateX(calc(var(--pw) * -0.5))}
  .book.closed-back {transform:translateX(calc(var(--pw) *  0.5))}
  .book.intro{transform:translateX(calc(var(--pw) * -0.5)) translateY(18px)}

  .leaf{position:absolute;top:0;left:50%;width:var(--pw);height:var(--ph);
    transform-origin:left center;transform-style:preserve-3d;
    transition:transform 1.1s cubic-bezier(.65,.05,.36,1);cursor:pointer}
  .leaf.turned{transform:rotateY(-180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--paper) center/cover no-repeat;overflow:hidden}
  .face.back{transform:rotateY(180deg)}
  .face.flap-l{background-size:auto 100%;background-position:left center}
  .face.flap-r{background-size:auto 100%;background-position:right center}
  /* gutter shading */
  .face.front::after,.face.back::after{content:"";position:absolute;inset:0;pointer-events:none}
  .face.front::after{background:linear-gradient(90deg,rgba(0,0,0,.14),rgba(0,0,0,.03) 5%,transparent 12%)}
  .face.back::after {background:linear-gradient(270deg,rgba(0,0,0,.14),rgba(0,0,0,.03) 5%,transparent 12%)}
  .face.cover::after{background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.08) 1.5%,transparent 4%)}
  .face.backcover::after{background:linear-gradient(270deg,rgba(0,0,0,.18),rgba(255,255,255,.08) 1.5%,transparent 4%)}

  /* soft shadow under the book */
  .shadow{position:absolute;left:50%;top:0;width:var(--pw);height:var(--ph);
    box-shadow:0 30px 60px -20px rgba(40,30,20,.35),0 8px 18px -8px rgba(40,30,20,.25);
    transition:left 1.1s cubic-bezier(.65,.05,.36,1),width 1.1s cubic-bezier(.65,.05,.36,1);pointer-events:none}
  .book.open .shadow{left:0;width:calc(var(--pw)*2)}
  .book.closed-back .shadow{left:0;width:var(--pw)}

  /* placeholder inner page */
  .ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;
    color:#c9c5bd;font-size:12px;letter-spacing:.08em}
  .ph .n{position:absolute;bottom:5%;font-size:10px;color:#b4b0a8}
  .back .ph .n{left:8%} .front .ph .n{right:8%}

  footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center;
    gap:22px;padding:24px;font-size:12px;color:var(--mute);z-index:10;letter-spacing:.04em}
  footer button{background:none;border:0;color:var(--ink);font:inherit;font-size:18px;
    width:34px;height:34px;border-radius:50%;cursor:pointer;transition:background .2s,opacity .2s}
  footer button:hover{background:rgba(0,0,0,.05)}
  footer button:disabled{opacity:.2;cursor:default;background:none}
  #label{min-width:72px;text-align:center;font-variant-numeric:tabular-nums}
  .hint{position:fixed;left:0;right:0;bottom:70px;text-align:center;font-size:12px;color:var(--mute);
    transition:opacity .6s;letter-spacing:.06em}
  .hint.off{opacity:0}
</style>
</head>
<body>
<header><span><b>디자인과 재료 × 프롬프트</b>&nbsp;&nbsp;Prompt Edition</span><span>김주연 지음</span></header>

<div class="stage"><div class="book intro" id="book"><div class="shadow"></div></div></div>

<div class="hint" id="hint">표지를 눌러 펼치기</div>
<footer>
  <button id="prev" aria-label="이전">‹</button>
  <span id="label">표지</span>
  <button id="next" aria-label="다음">›</button>
</footer>

<script>
/* ===== 속지 설정 =====
   속지 이미지를 img/pages/ 폴더에 넣고 순서대로 파일명을 적으면 됩니다.
   비워두면 PLACEHOLDER_COUNT 만큼 빈 자리 페이지가 들어갑니다. */
const INNER_COUNT = 63;
const INNER_PAGES = Array.from({length:INNER_COUNT},(_,i)=>`img/pages/${String(i+1).padStart(3,'0')}.webp`);
const PLACEHOLDER_COUNT = 8;

const COVER = {front:'img/front.webp', flapFront:'img/flap-front.webp',
               flapBack:'img/flap-back.webp', back:'img/back.webp'};
const RATIO = 728.504/515.906;   // 판형 세로/가로

const book = document.getElementById('book');
const pages = INNER_PAGES.length ? INNER_PAGES.slice() : Array.from({length:PLACEHOLDER_COUNT},()=>null);
if (pages.length % 2) pages.push(null); // 짝수로 맞춤

function face(cls, src, n){
  const d = document.createElement('div'); d.className = 'face ' + cls;
  if (src) d.dataset.src = src;
  else if (n && !INNER_PAGES.length) d.innerHTML = `<div class="ph">PAGE ${n}<span class="n">${n}</span></div>`;
  return d;
}
// leaves: [cover|front flap], [p1|p2], ..., [back flap|back cover]
const leaves = [];
function addLeaf(f, b){ const l=document.createElement('div'); l.className='leaf'; l.append(f,b); book.append(l); leaves.push(l); }
addLeaf(face('front cover', COVER.front), face('back flap-l', COVER.flapFront));
for (let i=0;i<pages.length;i+=2) addLeaf(face('front',pages[i],i+1), face('back',pages[i+1],i+2));
addLeaf(face('front flap-r', COVER.flapBack), face('back backcover', COVER.back));

let cur = 0; // number of turned leaves
const N = leaves.length;
function zFix(){ leaves.forEach((l,i)=>{ l.style.zIndex = i<cur ? i+1 : N-i; }); }

function render(){
  book.classList.toggle('closed-front', cur===0);
  book.classList.toggle('closed-back', cur===N);
  book.classList.toggle('open', cur>0 && cur<N);
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').disabled = cur===N;
  let t;
  if (cur===0) t='표지';
  else if (cur===N) t='뒷표지';
  else if (cur===1) t='날개 · 1';
  else if (cur===N-1) t=`${INNER_PAGES.length||pages.length} · 날개`;
  else t=`${(cur-1)*2} · ${(cur-1)*2+1}`;
  document.getElementById('label').textContent = t;
  load();
}
// 현재 펼침면 주변 페이지만 불러오기
function load(){
  for (let i=Math.max(0,cur-3); i<=Math.min(N-1,cur+4); i++)
    leaves[i].querySelectorAll('.face[data-src]').forEach(f=>{
      f.style.backgroundImage=`url(${f.dataset.src})`; f.removeAttribute('data-src'); });
}
function turn(dir){
  const idx = dir>0 ? cur : cur-1;
  if (idx<0 || idx>=N) return;
  const l = leaves[idx];
  l.style.zIndex = 999;
  l.classList.toggle('turned', dir>0);
  cur += dir;
  document.getElementById('hint').classList.add('off');
  render();
  clearTimeout(l._t); l._t = setTimeout(zFix, 560); // swap stacking mid-flip
}
leaves.forEach((l,i)=>l.addEventListener('click',()=> turn(i<cur ? -1 : 1)));
document.getElementById('prev').onclick=()=>turn(-1);
document.getElementById('next').onclick=()=>turn(1);
addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ') turn(1); if(e.key==='ArrowLeft') turn(-1); });
let sx=null;
addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{ if(sx==null)return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) turn(dx<0?1:-1); sx=null; });

function size(){
  const maxH = innerHeight*0.80, maxW = innerWidth*0.92/2;
  let ph = maxH, pw = ph/RATIO;
  if (pw>maxW){ pw=maxW; ph=pw*RATIO; }
  document.documentElement.style.setProperty('--pw', pw+'px');
  document.documentElement.style.setProperty('--ph', ph+'px');
}
addEventListener('resize', size); size(); zFix(); render();

// 시작: 닫힌 책이 떠오른 뒤 저절로 펼쳐짐
const pre = Object.values(COVER).map(s=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=s;}));
Promise.all(pre).then(()=>{
  requestAnimationFrame(()=>{ book.classList.add('ready'); book.classList.remove('intro'); });
  setTimeout(()=>{ if(cur===0) turn(1); }, 1900);
});
</script>
</body>
</html>
