<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디자인과 재료 × 프롬프트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eeece8; --ink:#2a2a2a; --mute:#9a968f; --paper:#fbfaf7; --card:#f8f7f4;
    --pw:300px; --ph:424px; /* set by JS */
    --ease:cubic-bezier(.65,.05,.36,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans KR",system-ui,sans-serif;overflow:hidden;
    -webkit-font-smoothing:antialiased;user-select:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  header{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;
    padding:22px 28px;font-size:12px;letter-spacing:.04em;color:var(--mute);z-index:20}
  header b{font-weight:500;color:var(--ink)}
  #toIndex{font-size:12px;letter-spacing:.06em;color:var(--mute);padding:6px 0;transition:color .2s,opacity .5s}
  #toIndex:hover{color:var(--ink)}
  body.indexing #toIndex{opacity:0;pointer-events:none}

  /* ================= INDEX (chapter bars) ================= */
  .index{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    padding:70px 28px 40px;z-index:5;transition:opacity .6s ease, transform .8s var(--ease)}
  body:not(.indexing) .index{opacity:0;pointer-events:none;transform:scale(.985)}
  .card{width:min(1180px,100%);height:min(760px,100%);background:var(--card);border-radius:6px;
    box-shadow:0 1px 0 rgba(0,0,0,.03),0 20px 50px -30px rgba(40,30,20,.25);
    padding:clamp(22px,3.4vw,44px);display:flex;flex-direction:column;gap:clamp(18px,3vh,34px)}

  .info{display:grid;grid-template-columns:1.25fr 1fr .7fr .6fr;gap:20px;
    color:#a7a49f;font-weight:300;font-size:clamp(16px,1.9vw,26px);line-height:1.12;min-height:3.6em}
  .info > div{white-space:pre-line;transition:opacity .25s}
  .info.swap > div{opacity:0}
  .info .num{font-variant-numeric:tabular-nums}
  .info .rgb{display:grid;grid-template-columns:auto auto;column-gap:.5em;justify-content:start}
  .info .rgb span:nth-child(even){text-align:right}

  .bars{flex:1;display:flex;gap:6px;min-height:0}
  .group{display:flex;flex-direction:column;gap:10px;min-width:0;flex:1 1 0;
    transition:flex-grow .7s var(--ease)}
  .glabel{height:2.6em;font-size:11px;line-height:1.25;color:#b1aea8;letter-spacing:.04em;
    white-space:nowrap;overflow:hidden;text-overflow:clip;padding-left:2px}
  .glabel b{font-weight:500;color:#8e8a84;margin-right:.4em}
  .gbars{flex:1;display:flex;gap:6px;min-height:0}
  .bar{position:relative;flex:1 1 0;min-width:0;border-radius:16px;overflow:hidden;cursor:pointer;
    transition:flex-grow .7s var(--ease), filter .3s;background:#bbb center/cover no-repeat}
  .bar.off{cursor:default}
  .bar .img{position:absolute;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity .5s}
  .bar.active .img{opacity:1}
  .bar .cap{position:absolute;left:18px;right:18px;bottom:16px;font-size:13px;line-height:1.35;
    color:#fff;opacity:0;transform:translateY(6px);transition:opacity .35s .15s, transform .35s .15s;white-space:nowrap}
  .bar.dark .cap{color:#3a3a32}
  .bar.active .cap{opacity:1;transform:none}
  .bar .cap small{display:block;font-size:11px;opacity:.75;letter-spacing:.05em}
  .bar .go{position:absolute;right:16px;top:14px;font-size:12px;letter-spacing:.06em;color:inherit;opacity:0;
    transition:opacity .35s .2s}
  .bar.active:not(.off) .go{opacity:.9}
  .bar.dark .go{color:#3a3a32} .bar:not(.dark) .go{color:#fff}

  /* ================= BOOK ================= */
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    perspective:2800px;transition:opacity .6s ease}
  body.indexing .stage, body.indexing footer{opacity:0;pointer-events:none}
  .book{position:relative;width:calc(var(--pw)*2);height:var(--ph);
    transform-style:preserve-3d;
    transition:transform 1.1s var(--ease), opacity 1s ease}
  .book.closed-front{transform:translateX(calc(var(--pw) * -0.5))}
  .book.closed-back {transform:translateX(calc(var(--pw) *  0.5))}
  .book.intro{transform:translateX(calc(var(--pw) * -0.5)) translateY(18px);opacity:0}

  .leaf{position:absolute;top:0;left:50%;width:var(--pw);height:var(--ph);
    transform-origin:left center;transform-style:preserve-3d;
    transition:transform var(--dur,1.1s) var(--ease);cursor:pointer}
  .leaf.turned{transform:rotateY(-180deg)}
  .leaf.instant{transition:none}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--paper) center/cover no-repeat;overflow:hidden}
  .face.back{transform:rotateY(180deg)}
  .face.flap-l{background-size:auto 100%;background-position:left center}
  .face.flap-r{background-size:auto 100%;background-position:right center}
  .face::after{content:"";position:absolute;inset:0;pointer-events:none}
  .face.front::after{background:linear-gradient(90deg,rgba(0,0,0,.14),rgba(0,0,0,.03) 5%,transparent 12%)}
  .face.back::after {background:linear-gradient(270deg,rgba(0,0,0,.14),rgba(0,0,0,.03) 5%,transparent 12%)}
  .face.cover::after{background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(255,255,255,.08) 1.5%,transparent 4%)}
  .face.backcover::after{background:linear-gradient(270deg,rgba(0,0,0,.18),rgba(255,255,255,.08) 1.5%,transparent 4%)}

  .shadow{position:absolute;left:50%;top:0;width:var(--pw);height:var(--ph);
    box-shadow:0 30px 60px -20px rgba(40,30,20,.35),0 8px 18px -8px rgba(40,30,20,.25);
    transition:left 1.1s var(--ease),width 1.1s var(--ease);pointer-events:none}
  .book.open .shadow{left:0;width:calc(var(--pw)*2)}
  .book.closed-back .shadow{left:0;width:var(--pw)}

  footer{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;align-items:center;
    gap:22px;padding:24px;font-size:12px;color:var(--mute);z-index:10;letter-spacing:.04em;transition:opacity .6s}
  footer button{color:var(--ink);font-size:18px;width:34px;height:34px;border-radius:50%;transition:background .2s,opacity .2s}
  footer button:hover{background:rgba(0,0,0,.05)}
  footer button:disabled{opacity:.2;cursor:default;background:none}
  #label{min-width:110px;text-align:center;font-variant-numeric:tabular-nums}

  @media (max-width:760px){
    header{padding:16px 18px} header .ed, header .au{display:none}
    .index{padding:56px 14px 20px}
    .info{grid-template-columns:1fr 1fr;row-gap:12px;font-size:17px;min-height:0}
    .bars,.gbars{gap:3px}
    .bar{border-radius:10px}
    .glabel{font-size:10px} .glabel .gt{display:none}
    .bar .cap{left:12px;bottom:12px;font-size:12px}
  }
</style>
</head>
<body class="indexing">
<header>
  <span><b>디자인과 재료 × 프롬프트</b><span class="ed">&nbsp;&nbsp;Prompt Edition</span></span>
  <span><button id="toIndex">← 목차</button></span>
  <span class="au">김주연 지음</span>
</header>

<!-- ===== 목차 화면 ===== -->
<section class="index">
  <div class="card">
    <div class="info" id="info"></div>
    <div class="bars" id="bars"></div>
  </div>
</section>

<!-- ===== 책 ===== -->
<div class="stage"><div class="book intro closed-front" id="book"><div class="shadow"></div></div></div>
<footer>
  <button id="prev" aria-label="이전">‹</button>
  <span id="label">표지</span>
  <button id="next" aria-label="다음">›</button>
</footer>

<script>
/* ===== 속지 설정 ===== */
const INNER_COUNT = 275;  // 속지 쪽수 (img/pages/001.webp ~ 275.webp)
const INNER_PAGES = Array.from({length:INNER_COUNT},(_,i)=>`img/pages/${String(i+1).padStart(3,'0')}.webp`);
const COVER = {front:'img/front.webp', flapFront:'img/flap-front.webp',
               flapBack:'img/flap-back.webp', back:'img/back.webp'};
const RATIO = 728.504/515.906;   // 판형 세로/가로

/* ===== 목차 설정 =====
   page: 열람본 PDF의 몇 번째 쪽에서 시작하는지 (없으면 '열람본 미수록'으로 표시)
   no  : 책에 인쇄된 쪽 번호 */
const PARTS = [
  {label:'', items:[
    {key:'cover', t:'표지', sub:'Cover', no:'—', color:'#7f8fb8', img:'img/front.webp', page:0,
      grad:'linear-gradient(170deg,#8f94c9 0%,#5ea7c4 45%,#c9876d 100%)'},
    {t:'서문 · 추천사', sub:'Preface', no:'—', color:'#dbd5dd', dark:1, page:4},
    {t:'Contents', sub:'목차', no:'003', color:'#7d93ab',
      grad:'linear-gradient(160deg,#a16a54 0%,#5c9bad 45%,#7c8cab 75%,#93656b 100%)', page:8},
  ]},
  {label:'<b>1</b>History & Introduction', part:'1부 · 재료의 역사와 개론', items:[
    {t:'디자인의 언어,\n재료의 본질', sub:'Intro.', no:'008', color:'#507d80', page:13},
    {t:'시간과 서사\n재료의 역사', sub:'Chapter 01 · History', no:'012', color:'#eb8a69', page:17},
    {t:'Text-to-Video', sub:'Chapter 01 · Creative Variations', no:'018', color:'#f3bba8', page:23, w:.5},
  ]},
  {label:'<b>2</b>Natural Materials', part:'2부 · 자연 재료의 물성과 적용', items:[
    {t:'따뜻함과 편안함\n목재 Wood', sub:'Chapter 02 · Wood', no:'044', color:'#ddd47c', page:49, dark:1},
    {t:'Texture', sub:'Chapter 02 · Creative Variations', no:'052', color:'#ebe6b3', page:57, w:.5, dark:1},
    {t:'견고함과 웅장함\n석재 Stone', sub:'Chapter 03 · Stone', no:'076', color:'#a3b89d', page:81, dark:1},
    {t:'Contrast', sub:'Chapter 03 · Creative Variations', no:'084', color:'#cad6c6', page:89, w:.5, dark:1},
  ]},
  {label:'<b>3</b>Structural & Patterned', part:'3부 · 구조와 패턴의 구축성', items:[
    {t:'단순함과 담백함\n시멘트와 콘크리트', sub:'Chapter 04 · Concrete', no:'106', color:'#707483', page:111},
    {t:'Volume & Shadow', sub:'Chapter 04 · Creative Variations', no:'112', color:'#acaeb7', page:117, w:.5},
    {t:'균형감과 율동감\n벽돌과 타일', sub:'Chapter 05 · Brick & Tile', no:'134', color:'#933a28', page:139},
    {t:'Pattern', sub:'Chapter 05 · Creative Variations', no:'140', color:'#c08d82', page:145, w:.5},
  ]},
  {label:'<b>4</b>Modern & Finishing', part:'4부 · 현대적 표면과 마감 기법', items:[
    {t:'투명함과 차가움\n유리와 금속', sub:'Chapter 06 · Glass & Metal', no:'158', color:'#668bb5', page:163},
    {t:'Reflection', sub:'Chapter 06 · Creative Variations', no:'164', color:'#a6bcd4', page:169, w:.5},
    {t:'부드러움과 섬세함\n패브릭과 벽지', sub:'Chapter 07 · Fabric & Wallpaper', no:'196', color:'#9aced3', page:201, dark:1},
    {t:'Tactility', sub:'Chapter 07 · Creative Variations', no:'202', color:'#c4e3e5', page:207, w:.5, dark:1},
  ]},
  {label:'<b>5</b>Future Vision', part:'5부 · 크리에이터, 공간에 감각의 재료 확장', items:[
    {t:'무한함과 가변성\n하이퍼-머티리얼', sub:'Chapter 08 · Hyper-Materials', no:'222', color:'#9185a4', page:227},
    {t:'Transcendence', sub:'Chapter 08 · Creative Variations', no:'224', color:'#bfb8ca', page:229, w:.5},
  ]},
  {label:'', items:[
    {t:'참고문헌', sub:'Reference', no:'266', color:'#5a5b64', grad:'linear-gradient(170deg,#2f3038 0%,#6b6f7e 55%,#4d6a8a 100%)', page:271},
  ]},
];

/* ---------- 책 만들기 ---------- */
const book = document.getElementById('book');
const pages = INNER_PAGES.slice(); if (pages.length % 2) pages.push(null);
function face(cls, src){ const d=document.createElement('div'); d.className='face '+cls; if(src) d.dataset.src=src; return d; }
const leaves = [];
function addLeaf(f,b){ const l=document.createElement('div'); l.className='leaf'; l.append(f,b); book.append(l); leaves.push(l); }
addLeaf(face('front cover',COVER.front), face('back flap-l',COVER.flapFront));
for (let i=0;i<pages.length;i+=2) addLeaf(face('front',pages[i]), face('back',pages[i+1]));
addLeaf(face('front flap-r',COVER.flapBack), face('back backcover',COVER.back));
const N = leaves.length;
let cur = 0, busy = false;
const spreadOf = p => Math.floor(p/2)+1;   // 속지 p쪽이 보이는 펼침 (넘긴 장 수)

function zFix(){ leaves.forEach((l,i)=>{ l.style.zIndex = i<cur ? i+1 : N-i; }); }
function loadAround(c){
  for (let i=Math.max(0,c-3); i<=Math.min(N-1,c+4); i++)
    leaves[i].querySelectorAll('.face[data-src]').forEach(f=>{
      f.style.backgroundImage=`url(${f.dataset.src})`; f.removeAttribute('data-src'); });
}
function sectionAt(c){ // 현재 펼침이 속한 장 이름
  let name = '';
  PARTS.forEach(g=>g.items.forEach(it=>{
    if (it.page && spreadOf(it.page)<=c)
      name = /^(Chapter|Intro)/.test(it.sub) ? it.sub.split(' · ')[0] : (it.sub==='Reference' ? 'Reference' : it.t.split('\n')[0]);
  }));
  return name;
}
function cull(){ // 펼친 면 근처 장만 그리기 (나머지는 화면에서 제거해 끊김·찢어짐 방지)
  const back = busy ? 14 : 2;
  leaves.forEach((l,i)=>{ l.style.display = (i>=cur-back && i<=cur+1) ? '' : 'none'; });
}
function render(){
  cull();
  book.classList.toggle('closed-front', cur===0);
  book.classList.toggle('closed-back', cur===N);
  book.classList.toggle('open', cur>0 && cur<N);
  document.getElementById('prev').disabled = cur===0;
  document.getElementById('next').disabled = cur===N;
  let t;
  if (cur===0) t='표지'; else if (cur===N) t='뒷표지';
  else if (cur===1) t='날개 · 1'; else if (cur===N-1) t=`${INNER_COUNT} · 날개`;
  else t=`${(cur-1)*2} · ${(cur-1)*2+1}`;
  const s = (cur>1 && cur<N-1) ? sectionAt(cur) : '';
  document.getElementById('label').textContent = s ? `${s} — ${t}` : t;
  loadAround(cur);
}
function turn(dir, dur=1.1){
  const idx = dir>0 ? cur : cur-1;
  if (idx<0 || idx>=N) return;
  const l = leaves[idx];
  l.style.setProperty('--dur', dur+'s');
  l.style.zIndex = 999;
  l.classList.toggle('turned', dir>0);
  cur += dir; render();
  clearTimeout(l._t); l._t = setTimeout(zFix, dur*500);
}
const userTurn = d => { if(!busy && !document.body.classList.contains('indexing')) turn(d); };
leaves.forEach((l,i)=>l.addEventListener('click',()=> userTurn(i<cur ? -1 : 1)));
document.getElementById('prev').onclick=()=>userTurn(-1);
document.getElementById('next').onclick=()=>userTurn(1);
addEventListener('keydown',e=>{
  if (document.body.classList.contains('indexing')) return;
  if(e.key==='ArrowRight'||e.key===' ') userTurn(1);
  if(e.key==='ArrowLeft') userTurn(-1);
  if(e.key==='Escape') showIndex();
});
let sx=null;
addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
addEventListener('touchend',e=>{ if(sx==null)return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40) userTurn(dx<0?1:-1); sx=null; });

function size(){
  const maxH = innerHeight*0.80, maxW = innerWidth*0.92/2;
  let ph = maxH, pw = ph/RATIO; if (pw>maxW){ pw=maxW; ph=pw*RATIO; }
  document.documentElement.style.setProperty('--pw', pw+'px');
  document.documentElement.style.setProperty('--ph', ph+'px');
}
addEventListener('resize', size); size();

function resetBook(){
  leaves.forEach(l=>{ l.classList.add('instant'); l.classList.remove('turned'); });
  cur = 0; zFix(); render();
  book.classList.add('intro');
  requestAnimationFrame(()=>requestAnimationFrame(()=>leaves.forEach(l=>l.classList.remove('instant'))));
}
zFix(); render();

/* 표지가 열린 뒤, 목표 펼침까지 빠르게 넘김 */
const wait = ms => new Promise(r=>setTimeout(r,ms));
async function openTo(target){
  busy = true;
  loadAround(0); loadAround(target);
  document.body.classList.remove('indexing');
  await wait(350);
  book.classList.remove('intro');
  await wait(900);
  // 멀리 있는 장이면 앞쪽 장들은 표지 아래에서 미리 넘겨 둠 (보이지 않게)
  const total = target - 1;
  const jump = total > 14 ? total - 10 : 0;
  const hidden = leaves.slice(1, 1+jump);
  hidden.forEach(l=>{ l.classList.add('instant','turned'); l.style.visibility='hidden'; });
  turn(1);                                  // 표지 열기
  if (jump){
    cur += jump; loadAround(cur);
    setTimeout(()=>{ hidden.forEach(l=>{ l.style.visibility=''; l.classList.remove('instant'); }); zFix(); render(); }, 540);
  }
  await wait(target>1 ? 700 : 1100);
  const steps = total - jump;
  if (steps > 0){
    const gap = Math.max(45, Math.min(110, 1600/steps));
    for (let i=0;i<steps;i++){ turn(1, .75); await wait(gap); }
    await wait(800);
  }
  busy = false; render();
}
function showIndex(){
  if (busy) return;
  document.body.classList.add('indexing');
  setTimeout(resetBook, 600);
}
document.getElementById('toIndex').onclick = showIndex;

/* ---------- 목차 막대 ---------- */
const barsEl = document.getElementById('bars'), infoEl = document.getElementById('info');
const groups = []; const all = [];
const hex2rgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
PARTS.forEach(g=>{
  const ge = document.createElement('div'); ge.className='group';
  const lab = document.createElement('div'); lab.className='glabel'; lab.innerHTML = g.label || '&nbsp;';
  const gb = document.createElement('div'); gb.className='gbars';
  ge.append(lab, gb); barsEl.append(ge); groups.push({el:ge, items:[]});
  g.items.forEach(it=>{
    it.group = g;
    const b = document.createElement('div');
    b.className = 'bar' + (it.dark?' dark':'') + (it.page==null?' off':'');
    b.style.background = it.grad || it.color;
    b.innerHTML = (it.img ? `<div class="img" style="background-image:url(${it.img})"></div>` : '') + `<div class="cap"><small>${it.sub}</small>${it.t.replace('\n',' ')}${it.page==null?'<small style="margin-top:4px">열람본 미수록</small>':''}</div>`
                + (it.page!=null ? `<span class="go">${it.key==='cover'?'처음부터 펼치기':'펼치기'} →</span>` : '');
    it.el = b; gb.append(b); groups[groups.length-1].items.push(it); all.push(it);
    b.addEventListener('mouseenter', ()=>{ if(matchMedia('(hover:hover)').matches) setActive(it); });
    b.addEventListener('click', ()=>{
      if (!matchMedia('(hover:hover)').matches && active!==it) { setActive(it); return; } // 터치: 첫 탭은 선택
      if (it.page==null) return;
      openTo(it.page===0 ? 1 : spreadOf(it.page));
    });
  });
});
let active = null;
function setActive(it){
  if (active===it) return; active = it;
  const W = 9;
  all.forEach(x=>{ x.el.classList.toggle('active', x===it); x.el.style.flexGrow = x===it ? W : (x.w||1); });
  groups.forEach(g=>{ g.el.style.flexGrow = g.items.reduce((s,x)=>s+(x===it?W:(x.w||1)),0); });
  const [r,g,b] = hex2rgb(it.color);
  infoEl.classList.add('swap');
  setTimeout(()=>{
    infoEl.innerHTML =
      `<div>${it.t}</div>`+
      `<div>${it.sub.replace(' · ','\n')}${it.group.part?`\n<span style="font-size:.6em;letter-spacing:.02em">${it.group.part}</span>`:''}</div>`+
      `<div class="num">${it.page==null?'열람본\n미수록':'Page\n'+it.no}</div>`+
      `<div class="rgb num"><span>R</span><span>${r}</span><span>G</span><span>${g}</span><span>B</span><span>${b}</span></div>`;
    infoEl.classList.remove('swap');
  }, 160);
}
setActive(all[0]);
</script>
</body>
</html>
